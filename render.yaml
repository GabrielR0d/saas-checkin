services:
  - type: web
    name: saas-checkin-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install && echo "--- BUILD DEBUG ---" && echo "PWD=$(pwd)" && ls prisma/ && head -n 20 prisma/schema.prisma && echo "--- END DEBUG ---" && npx prisma generate --schema=./prisma/schema.prisma && npm run build
    startCommand: npx prisma db push && node dist/server.js
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: saas-checkin-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 10000

databases:
  - name: saas-checkin-db
    databaseName: saascheckin
    plan: free

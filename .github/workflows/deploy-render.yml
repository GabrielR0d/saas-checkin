name: Deploy to Render

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'render.yaml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        run: |
          curl -fsS --retry 3 \
            "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" \
            -o /dev/null \
            && echo "✅ Deploy triggered" \
            || echo "⚠️  Deploy hook call failed — check RENDER_DEPLOY_HOOK_URL secret"

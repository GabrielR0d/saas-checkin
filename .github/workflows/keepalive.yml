name: Keepalive Backend

on:
  schedule:
      - cron: '*/10 * * * *'
        workflow_dispatch:

        jobs:
          ping:
              runs-on: ubuntu-latest
                  steps:
                        - name: Ping backend
                                run: |
                                          curl -sf 'https://saas-checkin-backend.onrender.com/api/v1/auth/check-slug?slug=ping' && echo 'OK' || echo 'WARN: backend not responding'

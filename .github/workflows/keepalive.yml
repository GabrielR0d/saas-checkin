name: Keepalive Backend

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health check
        run: |
          curl -sf https://saas-checkin-backend.onrender.com/api/v1/health -o /dev/null && echo 'OK' || echo 'WARN: backend not responding'

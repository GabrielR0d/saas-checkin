name: Keepalive Backend

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend
        run: |
          curl -s https://saas-checkin-backend.onrender.com/ -o /dev/null && echo 'OK' || echo 'WARN: backend not responding'
